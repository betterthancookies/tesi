[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tesiFL"
version = "1.1.6"
description = ""
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.32.1",
    "flwr-datasets[vision]>=0.6.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "pulp>=2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["tesiFL", "device", "strategies"]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.32.1"

[tool.flwr.app.components]
serverapp = "tesiFL.server_app:app"
clientapp = "tesiFL.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 250
clients-per-round = 6
battery-capacity-mah = 200.0

tiers-enabled = true
workload-enabled = true
workload-scale = 1.0
idle-enabled = true

smart-stale-weight = 0.3
smart-stale-max = 25
smart-soc-min = 0.20
smart-epochs-min = 2
smart-deadline-mult = 1.0
smart-probe-samples = 256
smart-max-waves = 2
smart-batch-min = 16
smart-batch-max = 64
smart-ablation = "none"
soc-guard = 0.0
broadcast = false
broadcast-nonresp = 0.10
broadcast-timeout-s = 1.0
broadcast-top-m = 0
world-battery = "nm"
model-name = "resnet20"
dataset = "cifar10"
augment = false
recharge-enabled = true
recharge-available = true
fraction-evaluate = 1.0
local-epochs = 5
learning-rate = 0.01
lr-max = 0.08
batch-size = 128
save-model = false
beta = 0.5
seed = 42
algorithm = "fedavg"
proximal-mu = 0.1
sage-a = 0.5
sage-b = 0.2
sage-c = 0.3
escs-utility = "s"
escs-selection = "d"
escs-min-battery = 0.20
escs-min-nq = 0.20
escs-cap-probabilistic = false
escs-first-round-all = true
results-dir = "results"
