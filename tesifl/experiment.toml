[campaign]
name        = "rechargeONdeviceON_ResNet18_C100_v2"
rounds      = 250
seeds       = [2026, 42, 73]
betas       = [0.1, 0.5, 1.0]
clients     = 100
k_fraction  = 0.2
gpus        = [2]
stagger_s   = 180
timeout_s   = 28800

algorithms = [
  "fedavg",
  "fedprox",
  "sage_lin",
  "sage_peuk",
  "sage_nm",
  "sage_smart_lin",
  "sage_smart_peuk",
  "sage_smart_nm",
  "escs_sd_lin",
  "escs_sd_peuk",
  "escs_sd_nm",
  "escs_sp_lin",
  "escs_sp_peuk",
  "escs_sp_nm",
  "escs_md_lin",
  "escs_md_peuk",
  "escs_md_nm",
  "escs_mp_lin",
  "escs_mp_peuk",
  "escs_mp_nm",
]

[world]
tiers      = true
workload   = true
idle       = true
recharge   = true
recharge_available = true

[device]
tiers = [
  { name = "low",  capacity_mah = 4820.0, macs_per_s = 13.9e9, train_power_w = 2.99 },
  { name = "mid",  capacity_mah = 4780.0, macs_per_s = 26.6e9, train_power_w = 4.00 },
  { name = "high", capacity_mah = 5000.0, macs_per_s = 30.5e9, train_power_w = 6.15 },
]
capacity_mah_uniform  = 200.0
macs_per_s_uniform    = 4e9
train_power_w_uniform = 3.0

idle_power_w  = 0.1

low_battery_soc = 0.20

soc_init_mean  = 0.75
soc_init_std   = 0.15
soc_init_range = [0.30, 1.00]

[battery]
v_nominal        = 3.7
rated_c_rate     = 0.2
dcdc_efficiency  = 1.0
peukert_n        = 1.05

[compute]
train_macs_factor = 3.0
batch_half        = 1.6
batch_ref         = 64

[comm]
bytes_per_param     = 4
energy_dl_j_per_mb  = 0.98
energy_ul_j_per_mb  = 2.96
bandwidth_dl_mbps   = 25.1
bandwidth_ul_mbps   = 10.0
session_promo_power_w = 1.2107
session_promo_time_s  = 0.265
session_tail_power_w  = 0.178
session_tail_time_s   = 10.2
rtt_s                 = 0.0695
ctrl_payload_kb       = 1.0

[workload]
states = { idle = 0.0, light = 0.10, heavy = 0.30 }
chain_low    = [[0.90, 0.10, 0.00], [0.35, 0.60, 0.05], [0.00, 0.40, 0.60]]
chain_medium = [[0.70, 0.28, 0.02], [0.20, 0.65, 0.15], [0.00, 0.30, 0.70]]
chain_high   = [[0.50, 0.45, 0.05], [0.10, 0.60, 0.30], [0.00, 0.20, 0.80]]

[recharge]
rate_per_hour = 0.126
c_rate = 1.0

[algo]
local_epochs      = 5
batch_size        = 128
learning_rate     = 0.01
fraction_evaluate = 0.2
proximal_mu       = 0.001

sage_abc = { "0.1" = [0.5, 0.0, 0.5], "0.5" = [0.2, 0.1, 0.7], "1.0" = [0.5, 0.2, 0.3] }
sage_ab  = { "0.1" = [0.4, 0.6], "0.5" = [0.6, 0.4], "1.0" = [0.9, 0.1] }

smart_stale_weight   = 0.3
smart_stale_max      = 25
smart_soc_min        = 0.20
smart_epochs_min     = 2
smart_deadline_mult  = 1.0
smart_probe_samples  = 256
smart_max_waves      = 2
smart_batch_min      = 16
smart_batch_max      = 128

broadcast            = true
broadcast_nonresp    = 0.10
broadcast_timeout_s  = 1.0
broadcast_top_m      = 0

escs_min_battery       = 0.20
escs_min_nq            = 0.20
escs_first_round_all   = true
escs_cap_probabilistic = false

[model]
name    = "resnet18"
dataset = "cifar100"
augment = true
[model.specs.resnet20_cifar10]
macs_fwd_per_sample = 40551040
n_params            = 269722
[model.specs.resnet20_cifar100]
macs_fwd_per_sample = 40556800
n_params            = 275572
[model.specs.resnet18_cifar10]
macs_fwd_per_sample = 555422720
n_params            = 11173962
[model.specs.resnet18_cifar100]
macs_fwd_per_sample = 555468800
n_params            = 11220132
