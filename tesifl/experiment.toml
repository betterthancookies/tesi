[campaign]
name        = "rechargeONdeviceON_ResNet20_bcast"        # -> risultati in results_<name>/
                             # fisica2 = Mandheling, 4G, Peukert 1.05, ricarica
                             # oraria, overhead 0.057 s, SAGE-smart B 16-64;
                             # bcast = fisica2 + broadcast dello stato per
                             # SAGE/ESCS/SAGE-smart + colonna n_soc_low (fig10)
rounds      = 250
seeds       = [2026]         # [2026, 7, 13] per tre seed
betas       = [0.1, 0.5, 1.0]
clients     = 30             # numero di SuperNode
k_fraction  = 0.2            # client per round = round(k_fraction * clients)
gpus        = [2]            # un SuperLink per GPU; beta i -> GPU (i mod n_gpu).
                             # Tante GPU quanti beta: in parallelo. Meno GPU:
                             # i beta della stessa GPU girano IN SEQUENZA.
                             # [1, 2, 3] sul vecchio server, [2] sul nuovo.
stagger_s   = 180            # ritardo fra l'avvio di una GPU e la successiva
timeout_s   = 14400          # una run oltre questo tempo e' considerata persa
                             # [B] 4 h: con batch piccoli (B = 8, sweep) la
                             # GPU fa 16x i passi di B = 128 e 2 h non bastano

# Algoritmi da eseguire. Commenta le righe che non ti servono.
# Il suffisso dell'etichetta e' la BATTERIA DEI DEVICE, cioe' la batteria
# fisica del mondo in cui gira la run (_shard.sh -> world-battery):
#   _lin   lineare      SoC -= P*dt / (V_nom * C)
#   _peuk  Peukert      SoC -= dt / (C' / I^n), n = battery.peukert_n
#   _nm    datasheet    P = V(SoC, I) * I, SoC -= I*dt / Q(I)
# Tier, workload, idle e ricarica sono gli stessi in tutti i mondi, e ogni
# algoritmo legge il SoC della batteria del device.
#               lineare           Peukert            datasheet
#   SAGE        sage_lin (*)      sage_peuk          sage_nm
#   SAGE-smart  sage_smart_lin    sage_smart_peuk    sage_smart_nm
#   ESCS-SD     escs_sd_lin       escs_sd_peuk       escs_sd_nm
# (*) sage_lin e' il SAGE del PAPER (pesi a,b,c di sage_abc, termine
#     rinnovabile, soglia 0.2); sage_peuk e sage_nm sono l'ABLAZIONE (a,b di
#     sage_ab, niente rinnovabile ne' soglia): fra sage_lin e gli altri due
#     cambia anche l'algoritmo.
# FedAvg e FedProx senza suffisso: batteria lineare (fedavg_nm ecc. per
# farli girare in un altro mondo).
# plot_battery_models.py mette i tre mondi di ogni algoritmo su un Pareto.
algorithms = [
  "fedavg",
  "fedprox",
  "sage_lin",
  "sage_peuk",
  "sage_nm",
  "sage_smart_lin",
  "sage_smart_peuk",
  "sage_smart_nm",
  "escs_sd_lin",
  "escs_sd_peuk",
  "escs_sd_nm",
]


# =====================================================================
#  MONDO: cosa e' acceso
# =====================================================================
# [B] tutti e quattro a false riproducono esattamente le campagne fatte
# prima dell'eterogeneita': e' l'ablazione che separa l'effetto del mondo
# da quello della politica di selezione.
[world]
tiers      = true    # tre tier hardware
workload   = true    # workload concorrente (catene di Markov)
idle       = true    # consumo fra i round (modello ESCS Sez. 4.2)
recharge   = true   # ricarica sporadica guidata dal SoC
# true  (a) in carica il device resta selezionabile e si allena a costo zero
# false (b) in carica il device esce dalla federazione (N-1 client)
recharge_available = true


# =====================================================================
#  DEVICE
# =====================================================================
[device]
# Tre tier in parti uguali = i tre telefoni MISURATI in Mandheling (Xu et
# al., MobiCom 2022, arXiv 2206.07509): training FP32 su CPU con TFLite,
# VGG-11 su CIFAR-10, batch 64. Fig. 5 = latenza per batch, Fig. 6 = energia
# per batch, Tab. 6 = 914 MFLOP di training per campione (= 457 MMAC, cioe'
# 3 x 152.6 MMAC di forward: lo stesso train_macs_factor = 3 usato qui).
#   macs_per_s    = 64 * 457e6 MAC / latenza       (velocita' di training)
#   train_power_w = energia / latenza              (potenza del telefono)
#   low  Redmi Note 9 Pro (Snapdragon 750G): 2.11 s, 6.3 J
#   mid  Xiaomi 10        (Snapdragon 865):  1.10 s, 4.4 J
#   high Xiaomi 11 Pro    (Snapdragon 888):  0.96 s, 5.9 J
# [B] il costo per unita' di lavoro e' quasi uguale nei tre (~0.2 J/GMAC): il
# telefono veloce finisce prima ma consuma piu' watt. Prima: 4/8/16 GMAC/s a
# 3 W per tutti (0.75/0.38/0.19 J/GMAC), senza fonte.
# [LIMITE] VGG-11 ha 64-512 canali, ResNet-20 16-64: su CPU ResNet-20 rende
# probabilmente meno GMAC/s. Misure per batch (niente throttling termico).
# Telefoni 2020-21 di fascia media e alta: manca un telefono economico.
tiers = [
  { name = "low",  capacity_mah = 3500.0, macs_per_s = 13.9e9, train_power_w = 2.99 },
  { name = "mid",  capacity_mah = 4000.0, macs_per_s = 26.6e9, train_power_w = 4.00 },
  { name = "high", capacity_mah = 4500.0, macs_per_s = 30.5e9, train_power_w = 6.15 },
]
# Usati SOLO con world.tiers = false (popolazione omogenea delle campagne
# precedenti): capacita', velocita' e potenza uguali per tutti.
capacity_mah_uniform  = 200.0
macs_per_s_uniform    = 4e9
train_power_w_uniform = 3.0   # derivata da EAFL (Arouj & Abdelmoniem 2022)

idle_power_w  = 0.1   # [DERIVATO] 0.1 W di ESCS su 4000 mAh

# Soglia di RISPARMIO ENERGETICO: un device sotto questo SoC e' contato come
# "in battery saver" (colonna n_soc_low del CSV, fig10). 20% e' la riserva di
# SAGE (vincolo 2e) e di ESCS (B_LVL_min); Android avvisa a 15% e gli utenti
# di Ferreira 2011 non scendono quasi mai sotto il 30%.
# [B] con la fisica nuova i device ESAURITI sono quasi zero (campagna
# fisica2): la metrica utile per l'utente e' quanti ne spingiamo sotto il 20%.
low_battery_soc = 0.20

# SoC iniziale: normale troncata, spostata verso la carica piena.
# [B] con l'uniforme il 29% dei client partiva sotto il 50%; qui il 5%.
# Ferreira et al. (Pervasive 2011, 4035 utenti Android): batteria media 67%
# nella giornata, massima 74% alle 5 del mattino -> 0.75 = inizio giornata.
soc_init_mean  = 0.75
soc_init_std   = 0.15   # [ASSUNZIONE]
soc_init_range = [0.30, 1.00]


[battery]
v_nominal        = 3.7    # Li-Ion, tensione costante
rated_c_rate     = 0.2    # rate a cui la capacita' nominale e' dichiarata
dcdc_efficiency  = 1.0
# Fit di Peukert sulle capacita' del datasheet della cella del mondo _nm
# ("Accurate Battery Model"): 2.60 / 2.50 / 2.39 Ah a 0.2C / 0.5C / 1C.
# Minimi quadrati di ln(Q/Q_R) contro ln(I/I_R), I_R = 0.2C: n = 1.050.
# [B] prima era 1.15 (valore da piombo-acido, senza fonte): in idle la cella
# Peukert durava 1.63 volte quella lineare, ora 1.18.
# [LIMITE] il fit copre 0.2C-1C; l'idle (~0.01C) e' un'estrapolazione.
# Usato dalla batteria di Peukert (mondo _peuk). La batteria da datasheet
# (mondo _nm) non ha esponenti: tabelle V(SoC, I) e Q(I) in battery_model.py.
peukert_n        = 1.05


[compute]
# fwd + bwd ~ 3x fwd: lo stesso rapporto di Mandheling (Tab. 6) e
# TrainDeeploy (2.85-2.97x misurato)
train_macs_factor = 3.0
# Costo fisso per batch (passo dell'ottimizzatore, chiamate del framework).
# Mandheling, Fig. 7(a,c): tempo per batch contro B (4..128) su Xiaomi 11 Pro,
# TFLite FP32, coordinate estratte dal PDF vettoriale e tarate sui valori a
# B=64 di Fig. 5. Costo fisso = t(4) - 4 * t(128)/128:
#   VGG16       0.12 s - 4 * 16.2 ms = 0.055 s
#   InceptionV3 0.22 s - 4 * 40.4 ms = 0.058 s
# [B] prima 0.115 s, "misurato su stanis (server GPU), riscalato": senza una
# derivazione scritta e non misurato su un telefono. Il valore conta: e'
# l'unico modo in cui B entra nel costo (vedi [compute] qui sotto).
# [LIMITE] un solo telefono (il top di gamma) e modelli piu' pesanti di
# ResNet-20; MNN dava ~0.02-0.03 s.
batch_overhead_s  = 0.057
# [B] la potenza di training e' COSTANTE per tier (train_power_w dei tier):
# non dipende piu' da B. Prima P(B) = 3 W * (B/128)^0.3, esponente senza
# fonte. Con potenza costante l'energia di un'epoca CALA al crescere di B
# (meno overhead per batch): non esiste un batch ottimo interno.


[comm]
bytes_per_param     = 4     # float32, nessuna compressione [ASSUNZIONE]
# Smartphone su rete 4G (LTE). Potenza durante un trasferimento misurata da
# Narayanan et al., "A Variegated Look at 5G in the Wild", SIGCOMM 2021
# (Galaxy S20 Ultra, Verizon LTE): P = c1 * T + c2, T = throughput.
#   c1: Tab. 8, 14.55 mW/Mbps in download, 80.21 mW/Mbps in upload;
#   c2: fit sui dati pubblici del paper (github SIGCOMM21-5G/artifact,
#       MN-Transfer), 2.72 W in download, 2.89 W in upload (le pendenze del
#       fit, 15.0 e 79.5, ritrovano la Tab. 8).
# Energia per MB = 8 * (c1 + c2 / T), con T della rete 4G italiana:
# Opensignal, "State of Mobile Networks: Italy", maggio 2018 (gen-mar 2018,
# 120 mila utenti): download Vodafone 33.9, TIM 28.7, 3 Italia 22.2, Wind
# 15.7 Mbps (media 25.1); upload ~10 Mbps (Vodafone 10.5, gli altri poco
# sotto). [B] prima 1.5 J/MB (dal relatore) e upload 1.5x senza fonte: 1.5
# J/MB corrisponde a ~16 Mbps, cioe' all'operatore piu' lento.
energy_dl_j_per_mb  = 0.98
energy_ul_j_per_mb  = 2.96
bandwidth_dl_mbps   = 25.1
bandwidth_ul_mbps   = 10.0
# SESSIONE radio (macchina a stati RRC): ogni trasferimento isolato paga una
# promozione IDLE->CONNECTED e poi la radio resta accesa per Ttail prima di
# tornare IDLE: ~2.1 J, qualunque sia la taglia del messaggio.
# [B] e' cio' che rende NON gratuiti i messaggi di controllo (stato, proposta):
# col solo costo per MB un heartbeat da 1 KB costerebbe ~2e-3 J. Vale per TUTTI
# gli algoritmi: download e upload del modello sono due sessioni per round.
# Narayanan et al. 2021, Verizon 4G: coda 178 mW (Tab. 2), Ttail 10.2 s e
# promozione 265 ms (Tab. 7). La potenza di promozione non c'e': Huang et
# al., MobiSys 2012, Tab. 3 (1210.7 mW; ~0.3 J, trascurabile).
# [B] prima Huang 2012 per tutto: coda 1.06 W x 11.6 s = 12.6 J a sessione.
# Metti session_tail_time_s = 0 e session_promo_time_s = 0 per tornare al
# modello di comunicazione con il solo costo per MB.
session_promo_power_w = 1.2107   # Huang 2012, Tab. 3
session_promo_time_s  = 0.265    # Narayanan 2021, Tab. 7 (Verizon 4G)
session_tail_power_w  = 0.178    # Narayanan 2021, Tab. 2 (Verizon 4G)
session_tail_time_s   = 10.2     # Narayanan 2021, Tab. 7 (UE-inactivity timer)
rtt_s                 = 0.0695   # RTT mediano LTE, 69.5 ms (Huang 2012, Sez. 4.1)
ctrl_payload_kb       = 1.0      # [ASSUNZIONE] messaggio di controllo, andata + ritorno


# =====================================================================
#  WORKLOAD CONCORRENTE
# =====================================================================
# w = frazione di calcolo occupata da ALTRE app. Entra senza coefficienti
# nuovi:  throughput = (1-w)*macs   e   P fra i round = P_idle + w*(P_train-P_idle)
# con macs e P_train DEL TIER: w e' una frazione della capacita' di quel
# telefono, e a parita' di w un telefono piu' potente fa piu' lavoro e consuma
# piu' watt (Mandheling: ~0.2 J/GMAC su tutti e tre i telefoni).
[workload]
# [ASSUNZIONE] utilizzazione dei tre stati: schermo spento, background,
# uso interattivo.
states = { idle = 0.0, light = 0.10, heavy = 0.30 }
# Tre catene, assegnate in parti uguali e INDIPENDENTEMENTE dal tier.
# Righe e colonne nell'ordine idle, light, heavy. Diagonali alte di
# proposito: con transizioni frequenti il workload diventa rumore bianco.
# Utilizzazioni medie stazionarie risultanti: 0.030 / 0.119 / 0.206.
chain_low    = [[0.90, 0.10, 0.00], [0.35, 0.60, 0.05], [0.00, 0.40, 0.60]]
chain_medium = [[0.70, 0.28, 0.02], [0.20, 0.65, 0.15], [0.00, 0.30, 0.70]]
chain_high   = [[0.50, 0.45, 0.05], [0.10, 0.60, 0.30], [0.00, 0.20, 0.80]]


# =====================================================================
#  RICARICA
# =====================================================================
[recharge]
# Tasso ORARIO: in un round di durata dt (ore) l'utente mette in carica con
#     p_i = 1 - exp(-rate_per_hour * (1 - SoC_i) * dt)
# [B] prima p = 0.005 * (1 - SoC) PER ROUND: un algoritmo con round piu'
# lunghi vedeva meno ricarica per ora di tempo reale. Ora tutti gli
# algoritmi vedono la stessa ricarica nel tempo.
# Ferreira et al., "Understanding Human-Smartphone Concerns: A Study of
# Battery Life", Pervasive 2011 (4035 utenti Android, 4 settimane): una
# sessione di carica principale al giorno (sera o notte, Fig. 5 e 7) con
# batteria media al 67% -> rate = 1 / (24 h * (1 - 0.67)) = 0.126 / h. E' lo
# stesso valore che riproduceva la taratura precedente (0.005 per round con
# round da ~140 s), sotto il "<5% di client in carica" del relatore.
# [LIMITE] gli utenti veri iniziano a caricare al 30-40% e quasi mai sotto il
# 30%; i nostri lasciano arrivare il telefono a zero: lo scenario e'
# pessimistico, e' quello che rende possibili gli esaurimenti.
rate_per_hour = 0.126
# Velocita' come C-rate, non watt: 20 W su 200 mAh sarebbero 27C.
# 1C = carica completa in un'ora a qualunque capacita'. Ferreira 2011: 1-2 h
# per una carica completa con i telefoni del 2010; i caricatori rapidi di
# oggi stanno a ~1C.
c_rate = 1.0


# =====================================================================
#  ALGORITMI
# =====================================================================
[algo]
local_epochs      = 5
batch_size        = 128
learning_rate     = 0.01   # paper SAGE
fraction_evaluate = 1.0
proximal_mu       = 0.1    # FedProx

# SAGE del paper (sage_lin): pesi (a,b,c) per beta, ottimi di Table 1.
sage_abc = { "0.1" = [0.5, 0.0, 0.5], "0.5" = [0.2, 0.1, 0.7], "1.0" = [0.5, 0.2, 0.3] }
# Ablazione di SAGE (sage_peuk, sage_nm) e SAGE-smart: pesi (a,b) per beta,
# dalla sweep in results_findbest.
# [B] SAGE-smart usa gli stessi dell'ablazione: il confronto fra i due isola
# l'assegnazione dinamica di (E,B), non la taratura.
sage_ab  = { "0.1" = [0.4, 0.6], "0.5" = [0.6, 0.4], "1.0" = [0.9, 0.1] }

# SAGE-smart: il server seleziona (a*SoC + b*D + c*anzianita') e propone un
# envelope di (E, B); il CLIENT sceglie dentro l'envelope con il proprio stato.
# Etichette sage_smart_lin / _peuk / _nm: stesso algoritmo, cambia solo la
# batteria dei device.
smart_stale_weight   = 0.3    # peso (c) dell'anzianita' nel punteggio
smart_stale_max      = 25     # round dopo i quali l'anzianita' e' al massimo
smart_soc_min        = 0.20   # riserva che il client non intacca (vincolo 2e di SAGE)
smart_epochs_min     = 2      # E_lo: minimo di epoche dell'envelope
smart_deadline_mult  = 1.0    # deadline = mult * mediana dei tempi nominali (E, B di [algo])
smart_probe_samples  = 256    # campioni locali per stimare la loss prima di decidere
# Negoziazione prima del training (documento "Client Server Protocol" del
# relatore, opzione 3 con l'opzione 2): il server ordina i client con una
# stima del SoC, propone l'envelope ai candidati, chi rifiuta viene sostituito.
smart_max_waves      = 2      # ondate di proposte per round (1 = nessun rimpiazzo)
# B di SAGE-smart (le baseline usano batch_size = 128). L'envelope propone le
# potenze di 2 fra smart_batch_min e smart_batch_max; il client sceglie il
# B "piu' economico per passo di SGD": il piu' piccolo, riducendo prima E, e
# sale al successivo solo se a quel B non ci sta nemmeno E_lo (batteria o
# deadline). Vedi tesiFL/client_policy.py.
# [B] B_min = 16 dallo sweep (results_sweepB*, SAGE-smart nm, 3 beta, B fisso):
#   B     8      16     32     64     128    256
#   acc   0.702  0.667  0.632  0.608  0.586  0.531
#   SoC   0.500  0.543  0.575  0.574  0.578  0.576
# l'accuracy cresce sempre al calare di B; il SoC e' piatto da 32 in su e
# cala sotto. 16 e' il punto piu' vicino all'ideale (acc e SoC massimi).
# [B] TETTO A 64, non 256. SAGE-smart aggrega con FedNova, che amplifica
# l'update di chi fa pochi passi di tau_eff/tau_i. Col range 16-256 un client
# fuori deadline ripiegava su B=256 e faceva ~18 passi contro ~290: spread
# 15-16 (soglia ~6-8) e modello collassato nel fastTest del 14/10. A 64 lo
# stesso client fa ~70 passi. Le partizioni grandi salgono a 32/64 e fanno
# comunque un numero di passi simile ai client a 16 (3000/32 ~ 1666/16).
smart_batch_min      = 16
smart_batch_max      = 64

# BROADCAST DELLO STATO a inizio round (opzione 1 del "Client Server
# Protocol" del relatore, call del 16/10) per le strategie che selezionano
# sullo stato: SAGE, ESCS, SAGE-smart (non FedAvg/FedProx, che scelgono a
# caso). Nel simulatore non cambia l'informazione (SAGE/ESCS leggono il SoC
# del mondo, SAGE-smart la sua stima, errore < 1 punto di SoC): serve a
# CONTARNE IL COSTO, perche' dichiariamo di avere un SoC fidato a inizio
# round. Chi risponde paga uno scambio di controllo (sessione 4G intera,
# ~2.1 J, se non viene selezionato; il solo payload se viene selezionato);
# chi non risponde e' escluso dal round; il round si allunga della latenza
# o del timeout. Stima: ~3 Wh di broadcast + ~1 Wh di attesa su 250 round.
broadcast            = true
broadcast_nonresp    = 0.10   # client che non rispondono (indicazione del relatore)
broadcast_timeout_s  = 1.0    # [ASSUNZIONE] attesa delle risposte mancanti (~3x promozione + RTT)
broadcast_top_m      = 0      # 0 = tutti; M > 0 = solo i primi M per stima (nota 3, solo SAGE-smart)

# ESCS
escs_min_battery       = 0.20   # B_LVL_min, Table 4 del paper
escs_min_nq            = 0.20   # NQ_min, Table 4
escs_first_round_all   = true   # Alg. 1 righe 5-6
escs_cap_probabilistic = false

[model]
name    = "resnet20"       # "resnet20" | "resnet18"
dataset = "cifar10"        # "cifar10" | "cifar100" (Hugging Face uoft-cs/...)
# ResNet-20 per CIFAR (He et al. 2016, n=3): 40.55 MMAC/campione, 62x LeNet-5.
# [B] il cambio da LeNet serve perche' con batterie realistiche LeNet
# consumava cosi' poco da richiedere decine di migliaia di round per il primo
# esaurimento.
# ResNet-18 (variante CIFAR: conv 3x3 iniziale, niente max-pool) con
# CIFAR-100: 555 MMAC/campione (13.7x ResNet-20) e 44.9 MB di modello (41x):
# training e comunicazione molto piu' cari, vedi lo SCENARIO qui sotto.
#
# MAC di forward per immagine e parametri allenabili per ogni combinazione,
# CONTATI sul modello (hook su Conv2d e Linear, 15/10/2026). La fisica usa la
# voce "<name>_<dataset>"; il server si ferma se la run usa un altro modello.
[model.specs.resnet20_cifar10]
macs_fwd_per_sample = 40551040
n_params            = 269722
[model.specs.resnet20_cifar100]
macs_fwd_per_sample = 40556800
n_params            = 275572
[model.specs.resnet18_cifar10]
macs_fwd_per_sample = 555422720
n_params            = 11173962
[model.specs.resnet18_cifar100]
macs_fwd_per_sample = 555468800
n_params            = 11220132

# =====================================================================
#  SCENARIO "ResNet-18 su CIFAR-100" (richiesta del relatore)
# =====================================================================
# Si attiva cambiando SOLO questi valori (il resto resta com'e'):
#   [model]     name = "resnet18"     dataset = "cifar100"
#   [campaign]  clients = 100         k_fraction = 0.2   (20 per round)
#               name = "<nuovo nome>" timeout_s = 28800 (8 h: run molto piu' lunghe)
#   [algo]      smart_batch_max = 128 (SAGE-smart E 2-10, B 16-128;
#               baseline E = 5, B = 128 come ora)
#               fraction_evaluate = 0.2 consigliato: con 100 client la
#               valutazione lato client manderebbe il modello da 45 MB a tutti
#               e 100 a ogni round. L'accuracy e' quella del server (test set
#               centrale); la loss lato client serve solo a ESCS, che per i
#               client non valutati usa la loss massima (esplorazione).
# Se le run sono troppo lunghe: clients = 30, k_fraction = 0.2 (6 per round).
# [B] attenzione: con 30 client il training per round NON cala (6 x 1333
# campioni = 20 x 400) e ogni partecipazione costa 3.5-5.5% di batteria invece
# di 1.3-1.9%: si risparmia solo sui messaggi, non sulla GPU.
# Sul server CIFAR-100 va scaricato una volta (HF_HUB_OFFLINE=1 nei SuperLink):
#   python -c "from datasets import load_dataset; load_dataset('uoft-cs/cifar100')"
# [B] B fino a 128 in SAGE-smart riapre il rischio FedNova (spread dei passi,
# vedi smart_batch_max): il fastTest controlla che resti <= 8.