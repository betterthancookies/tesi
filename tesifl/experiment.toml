[campaign]
name        = "rechargeONdeviceON_ResNet20_batterie"        # -> risultati in results_<name>/
rounds      = 250
seeds       = [2026]         # [2026, 7, 13] per tre seed
betas       = [0.1, 0.5, 1.0]
clients     = 30             # numero di SuperNode
k_fraction  = 0.2            # client per round = round(k_fraction * clients)
gpus        = [1, 2, 3]      # un SuperLink per GPU; i beta girano in parallelo
stagger_s   = 180            # ritardo fra l'avvio di uno shard e il successivo
timeout_s   = 7200           # una run oltre questo tempo e' considerata persa

# Algoritmi da eseguire. Commenta le righe che non ti servono.
# Il suffisso dell'etichetta e' la BATTERIA DEI DEVICE, cioe' la batteria
# fisica del mondo in cui gira la run (_shard.sh -> world-battery):
#   _lin   lineare      SoC -= P*dt / (V_nom * C)
#   _peuk  Peukert      SoC -= dt / (C' / I^n), n = battery.peukert_n
#   _nm    datasheet    P = V(SoC, I) * I, SoC -= I*dt / Q(I)
# Tier, workload, idle e ricarica sono gli stessi in tutti i mondi, e ogni
# algoritmo legge il SoC della batteria del device.
#               lineare           Peukert            datasheet
#   SAGE        sage_lin (*)      sage_peuk          sage_nm
#   SAGE-smart  sage_smart_lin    sage_smart_peuk    sage_smart_nm
#   ESCS-SD     escs_sd_lin       escs_sd_peuk       escs_sd_nm
# (*) sage_lin e' il SAGE del PAPER (pesi a,b,c di sage_abc, termine
#     rinnovabile, soglia 0.2); sage_peuk e sage_nm sono l'ABLAZIONE (a,b di
#     sage_ab, niente rinnovabile ne' soglia): fra sage_lin e gli altri due
#     cambia anche l'algoritmo.
# FedAvg e FedProx senza suffisso: batteria lineare (fedavg_nm ecc. per
# farli girare in un altro mondo).
# plot_battery_models.py mette i tre mondi di ogni algoritmo su un Pareto.
algorithms = [
  "fedavg",
  "fedprox",
  "sage_lin",
  "sage_peuk",
  "sage_nm",
  "sage_smart_lin",
  "sage_smart_peuk",
  "sage_smart_nm",
  "escs_sd_lin",
  "escs_sd_peuk",
  "escs_sd_nm",
]


# =====================================================================
#  MONDO: cosa e' acceso
# =====================================================================
# [B] tutti e quattro a false riproducono esattamente le campagne fatte
# prima dell'eterogeneita': e' l'ablazione che separa l'effetto del mondo
# da quello della politica di selezione.
[world]
tiers      = true    # tre tier hardware
workload   = true    # workload concorrente (catene di Markov)
idle       = true    # consumo fra i round (modello ESCS Sez. 4.2)
recharge   = true   # ricarica sporadica guidata dal SoC
# true  (a) in carica il device resta selezionabile e si allena a costo zero
# false (b) in carica il device esce dalla federazione (N-1 client)
recharge_available = true


# =====================================================================
#  DEVICE
# =====================================================================
[device]
# Tre tier in parti uguali. Velocita' 1x/2x/4x: rapporti standard fra fasce
# di SoC. Ignatov et al. (AI Benchmark, ICCVW 2019) riportano fino a 20x fra
# CPU e acceleratore dello stesso chip, quindi 4x e' conservativo.
tiers = [
  { name = "low",  capacity_mah = 3500.0, speed_mult = 1.0 },
  { name = "mid",  capacity_mah = 4000.0, speed_mult = 2.0 },
  { name = "high", capacity_mah = 4500.0, speed_mult = 4.0 },
]
# Usata SOLO con world.tiers = false (popolazione omogenea).
capacity_mah_uniform = 200.0

macs_per_s    = 4e9   # [ASSUNZIONE] throughput del tier base (1x)
train_power_w = 3     # [ASSUNZIONE] derivata da EAFL (Arouj & Abdelmoniem 2022)
idle_power_w  = 0.1   # [DERIVATO] 0.1 W di ESCS su 4000 mAh

# SoC iniziale: normale troncata, spostata verso la carica piena.
# [B] con l'uniforme il 29% dei client partiva sotto il 50%; qui il 5%.
soc_init_mean  = 0.75   # [ASSUNZIONE]
soc_init_std   = 0.15   # [ASSUNZIONE]
soc_init_range = [0.30, 1.00]


[battery]
v_nominal        = 3.7    # Li-Ion, tensione costante
rated_c_rate     = 0.2    # rate a cui la capacita' nominale e' dichiarata
dcdc_efficiency  = 1.0
# [ASSUNZIONE] 1.15 e' nell'intervallo del piombo-acido; per il litio la
# letteratura da' 1.01-1.10. VERIFICATO: a n=1.05 l'errore del modello
# lineare scende da 1.26x a 1.08x e gli esaurimenti passano da 10 a 0 nella
# cella 100 mAh / N=30 / beta=0.1. Tenuto a 1.15 come scelta dichiarata; la
# violazione della soglia (SoC minimo 0.102 contro riserva 0.20) resta anche
# a 1.05, ed e' l'affermazione robusta.
# Usato dalla batteria di Peukert (mondo _peuk). La batteria da datasheet
# (mondo _nm) non ha esponenti: tabelle V(SoC, I) e Q(I) in battery_model.py.
peukert_n        = 1.15


[compute]
train_macs_factor = 3.0    # [ASSUNZIONE] fwd + bwd ~ 3x fwd
batch_overhead_s  = 0.115  # [MISURATO su stanis, riscalato al device simulato]
batch_size_ref    = 128    # batch a cui la potenza e' esattamente train_power_w
power_exponent_batch = 0.3 # [ASSUNZIONE] P(B) = P0 * (B/B_ref)^gamma
power_batch_mult_min = 0.5
power_batch_mult_max = 3.0


[comm]
bytes_per_param     = 4     # float32, nessuna compressione [ASSUNZIONE]
energy_rx_j_per_mb  = 1.5   # [DAL RELATORE] 4G LTE; WiFi sarebbe ~0.1
tx_rx_energy_ratio  = 1.5   # [ASSUNZIONE] TX piu' cara di RX
bandwidth_mb_per_s  = 2.0   # [ASSUNZIONE]
# Attivazione della radio LTE (macchina a stati RRC), Huang et al., "A Close
# Examination of Performance and Power Characteristics of 4G LTE Networks",
# MobiSys 2012, Tabella 3 e Sez. 4.1. Ogni SESSIONE radio (un trasferimento
# isolato) paga una promozione IDLE->CONNECTED e poi resta accesa per Ttail
# prima di tornare IDLE: ~12.6 J, qualunque sia la taglia del messaggio.
# [B] e' cio' che rende NON gratuiti i messaggi di controllo (stato, proposta):
# col solo costo per MB un heartbeat da 1 KB costerebbe ~1e-3 J. Vale per TUTTI
# gli algoritmi: download e upload del modello sono due sessioni per round.
# Metti session_tail_time_s = 0 e session_promo_time_s = 0 per tornare al
# modello di comunicazione precedente (solo J/MB).
session_promo_power_w = 1.2107   # LTE promotion, 1210.7 mW
session_promo_time_s  = 0.2601   # Tpro, 260.1 ms
session_tail_power_w  = 1.0600   # LTE tail base, 1060.0 mW
session_tail_time_s   = 11.576   # Ttail (RRC inactivity timer), 11.576 s
rtt_s                 = 0.0695   # RTT mediano LTE, 69.5 ms (Sez. 4.1)
ctrl_payload_kb       = 1.0      # [ASSUNZIONE] messaggio di controllo, andata + ritorno


# =====================================================================
#  WORKLOAD CONCORRENTE
# =====================================================================
# w = frazione di calcolo occupata da ALTRE app. Entra senza coefficienti
# nuovi:  throughput = (1-w)*macs   e   P fra i round = P_idle + w*(P_train-P_idle)
[workload]
# [ASSUNZIONE] utilizzazione dei tre stati: schermo spento, background,
# uso interattivo.
states = { idle = 0.0, light = 0.10, heavy = 0.30 }
# Tre catene, assegnate in parti uguali e INDIPENDENTEMENTE dal tier.
# Righe e colonne nell'ordine idle, light, heavy. Diagonali alte di
# proposito: con transizioni frequenti il workload diventa rumore bianco.
# Utilizzazioni medie stazionarie risultanti: 0.030 / 0.119 / 0.206.
chain_low    = [[0.90, 0.10, 0.00], [0.35, 0.60, 0.05], [0.00, 0.40, 0.60]]
chain_medium = [[0.70, 0.28, 0.02], [0.20, 0.65, 0.15], [0.00, 0.30, 0.70]]
chain_high   = [[0.50, 0.45, 0.05], [0.10, 0.60, 0.30], [0.00, 0.20, 0.80]]


# =====================================================================
#  RICARICA
# =====================================================================
[recharge]
# p_i = prob_base * (1 - SoC_i) per round.
# [B] TARATURA: con 0.05 il SoC medio sale a 0.82 e gli esaurimenti vanno a
# zero -- la ricarica appiattisce tutto. Il "<5% di client in carica" indicato
# dal relatore e' la frazione ISTANTANEA in carica e corrisponde a ~0.005 di
# probabilita' per round. Sensitivity: 0.05 -> 16% in carica, 0 morti;
# 0.01 -> 7%, 7 morti; 0.005 -> 5%, 7 morti.
prob_base = 0.005
# Velocita' come C-rate, non watt: 20 W su 200 mAh sarebbero 27C.
# 1C = carica completa in un'ora a qualunque capacita'.
c_rate = 1.0


# =====================================================================
#  ALGORITMI
# =====================================================================
[algo]
local_epochs      = 5
batch_size        = 128
learning_rate     = 0.01   # paper SAGE
fraction_evaluate = 1.0
proximal_mu       = 0.1    # FedProx

# SAGE del paper (sage_lin): pesi (a,b,c) per beta, ottimi di Table 1.
sage_abc = { "0.1" = [0.5, 0.0, 0.5], "0.5" = [0.2, 0.1, 0.7], "1.0" = [0.5, 0.2, 0.3] }
# Ablazione di SAGE (sage_peuk, sage_nm) e SAGE-smart: pesi (a,b) per beta,
# dalla sweep in results_findbest.
# [B] SAGE-smart usa gli stessi dell'ablazione: il confronto fra i due isola
# l'assegnazione dinamica di (E,B), non la taratura.
sage_ab  = { "0.1" = [0.4, 0.6], "0.5" = [0.6, 0.4], "1.0" = [0.9, 0.1] }

# SAGE-smart: il server seleziona (a*SoC + b*D + c*anzianita') e propone un
# envelope di (E, B); il CLIENT sceglie dentro l'envelope con il proprio stato.
# Etichette sage_smart_lin / _peuk / _nm: stesso algoritmo, cambia solo la
# batteria dei device.
smart_stale_weight   = 0.3    # peso (c) dell'anzianita' nel punteggio
smart_stale_max      = 25     # round dopo i quali l'anzianita' e' al massimo
smart_soc_min        = 0.20   # riserva che il client non intacca (vincolo 2e di SAGE)
smart_epochs_min     = 2      # E_lo: minimo di epoche dell'envelope
smart_deadline_mult  = 1.0    # deadline = mult * mediana dei tempi nominali (E, B di [algo])
smart_probe_samples  = 256    # campioni locali per stimare la loss prima di decidere
# Negoziazione prima del training (documento "Client Server Protocol" del
# relatore, opzione 3 con l'opzione 2): il server ordina i client con una
# stima del SoC, propone l'envelope ai candidati, chi rifiuta viene sostituito.
smart_max_waves      = 2      # ondate di proposte per round (1 = nessun rimpiazzo)

# ESCS
escs_min_battery       = 0.20   # B_LVL_min, Table 4 del paper
escs_min_nq            = 0.20   # NQ_min, Table 4
escs_first_round_all   = true   # Alg. 1 righe 5-6
escs_cap_probabilistic = false

[model]
name = "resnet20"          # "lenet5" | "resnet20"
# ResNet-20 per CIFAR (He et al. 2016, n=3): 40.55 MMAC/campione, 62x LeNet-5.
# [B] il cambio serve perche' con batterie realistiche LeNet consumava cosi'
# poco da richiedere decine di migliaia di round per il primo esaurimento.
macs_fwd_per_sample = 40551040
n_params = 269722